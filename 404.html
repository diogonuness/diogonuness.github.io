<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada · Diogo Araujo Nunes</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- O GitHub Pages mostra este arquivo em qualquer endereço que não existe.
       Por isso os caminhos começam com "/" (a raiz do site). -->
  <script>
    try {
      var temaSalvo = localStorage.getItem('tema');
      if (temaSalvo === 'light' || temaSalvo === 'dark') document.documentElement.dataset.theme = temaSalvo;
    } catch (erro) {}
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="wrap erro">
    <p class="rotulo">Erro 404</p>
    <h1 class="erro__titulo">Esta página não existe.</h1>
    <p class="erro__texto">O endereço pode ter mudado ou o arquivo ainda não foi publicado. <span lang="en">Page not found.</span></p>
    <a class="botao botao--primario" href="/">Voltar ao início</a>
  </main>
</body>
</html>
